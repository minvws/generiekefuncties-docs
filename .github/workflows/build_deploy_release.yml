name: Build and attach static content to a GitHub release

on:
  release:
    types: [published]

  # Allows you to (re)build the asset for an existing release from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name of the existing release to attach the zip to"
        required: true
        type: string


permissions:
  contents: write
  packages: write

jobs:
  build:
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build and push to local registry
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: localhost:5000/fhir/publisher:${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Build
        run: |
          mkdir -p ./output
          docker run --name=scp --rm \
            -v ${{ github.workspace }}/input:/app/input \
            -v ${{ github.workspace }}/output:/app/output \
            -v ${{ github.workspace }}/ig.ini:/app/ig.ini \
            -v ${{ github.workspace }}/sushi-config.yaml:/app/sushi-config.yaml \
            localhost:5000/fhir/publisher:${{ github.sha }}
      - name: Package output as csd/<tag>/ zip
        run: |
          mkdir -p "dist/csd/${TAG}"
          cp -a ./output/. "dist/csd/${TAG}/"
          (cd dist && zip -rq "../csd-${TAG}.zip" csd)
      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" "csd-${TAG}.zip" --clobber --repo "${{ github.repository }}"
