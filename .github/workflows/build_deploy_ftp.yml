name: Build and Deploy static content with Docker to an FTPS server

on:
  # Runs on pushes targeting the default branch
  # push:
  #   branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


permissions:
  contents: read
  packages: write

jobs:
  build:
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build and push to local registry
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: localhost:5000/fhir/publisher:${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p ./output
          docker run --name=scp --rm \
            -v ${{ github.workspace }}/input:/app/input \
            -v ${{ github.workspace }}/output:/app/output \
            -v ${{ github.workspace }}/ig.ini:/app/ig.ini \
            -v ${{ github.workspace }}/sushi-config.yaml:/app/sushi-config.yaml \
            localhost:5000/fhir/publisher:${{ github.sha }}
      - name: Deploy to gf.afsprakenstelsel.nl
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: www784.your-server.de
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./output/
          server-dir: public_html/gf/
          timeout: 60000